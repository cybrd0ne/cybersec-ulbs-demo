# Suricata EVE JSON to OpenSearch, normalised to the Elastic Common Schema and enriched
# with MISP indicators. The json codec parses the event first; every mutate acts on the
# parsed fields only, never on the raw message (see .claude/memory/no-gsub-on-raw-message.md).
# Detection content for this telemetry lives in detections/ (R-03). Enrichment is R-04.

input {
  file {
    path => "/data/eve.json"
    codec => json
    start_position => "beginning"
    sincedb_path => "/dev/null"
  }
}

filter {
  # ECS field mapping on parsed fields.
  mutate {
    rename => {
      "[src_ip]"  => "[source][ip]"
      "[dest_ip]" => "[destination][ip]"
      "[proto]"   => "[network][transport]"
    }
  }

  if [event_type] == "alert" {
    mutate {
      add_field => {
        "[event][kind]"     => "alert"
        "[event][category]" => "intrusion_detection"
      }
    }
  }

  date { match => ["timestamp", "ISO8601"] }

  # R-04: correlate the destination against MISP indicators pulled by scripts/misp_pull.py.
  translate {
    source           => "[destination][ip]"
    target           => "[threat][indicator][matched]"
    dictionary_path  => "/enrich/ioc_ip.yml"
    refresh_interval => 300
    fallback         => "none"
  }

  if [threat][indicator][matched] != "none" {
    mutate {
      add_tag   => ["threat_match"]
      add_field => { "[event][risk_score]" => 80 }
    }
  }
}

output {
  opensearch {
    hosts    => ["https://opensearch:9200"]
    index    => "suricata-%{+YYYY.MM.dd}"
    user     => "admin"
    password => "${OPENSEARCH_INITIAL_ADMIN_PASSWORD}"
    ssl_certificate_verification => false
  }
}
