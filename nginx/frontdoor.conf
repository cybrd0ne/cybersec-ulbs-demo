# TLS front door for OpenSearch Dashboards. The certificate is issued by the lab root
# CA (see docs/pki.md) and mounted at runtime; it is never committed.
server {
    listen 8443 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/frontdoor.crt;
    ssl_certificate_key /etc/nginx/certs/frontdoor.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass https://opensearch-dashboards:5601;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_verify off;
    }
}
