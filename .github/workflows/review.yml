# Automated pull-request review by an agent (R-01 reinforcement). Copilot code review is
# not part of Copilot Free, so this uses an Actions-based reviewer with the project's own
# model API key. On a public repo, pull requests from forks do not receive repository
# secrets, so the reviewer skips outside contributors and the API key stays safe.
# Actions are pinned by commit SHA (R-06). GitHub context reaches the shell through env,
# never through ${{ }} inside run, so a crafted ref name cannot inject commands.
name: ai-review
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - env:
          BASE_REF: ${{ github.base_ref }}
        run: git diff "origin/${BASE_REF}...HEAD" > pr.diff
      - run: pip install anthropic && python scripts/review.py pr.diff > review.md
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          path: review.md
