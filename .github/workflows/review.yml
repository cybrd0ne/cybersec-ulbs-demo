# Automated pull-request review by an agent (R-01 reinforcement). Copilot code review is
# not part of Copilot Free, so this uses an Actions-based reviewer with the project's own
# model API key. On a public repo, pull requests from forks do not receive repository
# secrets, so the reviewer skips outside contributors and the API key stays safe.
name: ai-review
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git diff "origin/${{ github.base_ref }}...HEAD" > pr.diff
      - run: pip install anthropic && python scripts/review.py pr.diff > review.md
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: review.md
